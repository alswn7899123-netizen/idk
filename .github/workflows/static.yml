name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static portfolio
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          tar -xzf site-source.tar.gz
          cp -R public dist
          python3 - <<'PY'
          import os
          from pathlib import Path
          for file in Path('dist').glob('*.html'):
              file.write_text(file.read_text().replace('__SITE_ORIGIN__', os.environ['PAGE_URL'].rstrip('/')))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
